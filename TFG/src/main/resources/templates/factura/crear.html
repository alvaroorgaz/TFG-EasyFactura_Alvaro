<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${factura.idFactura == null} ? 'Nueva Factura' : 'Editar Factura'"></h2>

    <form th:action="@{/factura}" th:object="${factura}" method="post">
        <input type="hidden" th:field="*{idFactura}" />

        <div class="mb-3" th:if="${esAdmin}">
            <label class="form-label">Empresa</label>
            <select class="form-select" name="empresaId" required>
                <option value="">Selecciona una empresa</option>
                <option th:each="empresaItem : ${empresas}"
                        th:value="${empresaItem.id_empresa}"
                        th:text="${empresaItem.nombre}"
                        th:selected="${factura.empresa != null and factura.empresa.id_empresa == empresaItem.id_empresa}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" name="clienteId" required>
                <option value="">Selecciona un cliente</option>
                <option th:each="clienteItem : ${clientes}"
                        th:value="${clienteItem.idCliente}"
                        th:text="${clienteItem.nombre}"
                        th:selected="${factura.cliente != null and factura.cliente.idCliente == clienteItem.idCliente}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}" required>
                <option value="">Selecciona un estado</option>
                <option th:each="estadoItem : ${estados}"
                        th:value="${estadoItem}"
                        th:text="${estadoItem}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Hash VeriFactu</label>
            <input type="text" class="form-control" th:field="*{hashVerifactu}" maxlength="150" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/factura}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center text-bg-success border-0" role="alert" th:if="${success}" id="successToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

    <div class="toast align-items-center text-bg-danger border-0" role="alert" th:if="${error}" id="errorToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const successToast = document.getElementById("successToast");
        const errorToast = document.getElementById("errorToast");

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }
    });
</script>

</body>
</html>
