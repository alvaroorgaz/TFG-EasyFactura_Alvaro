<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments :: main-navbar}"></div>

<div class="container mt-4 pb-5 flex-grow-1">

    <h2>Listado de Facturas</h2>

    <a th:href="@{/factura/crear}" class="btn btn-success mb-3">
        Nueva Factura
    </a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Empresa</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Total</th>
            <th>Hash VeriFactu</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="factura : ${facturas}">
            <td th:text="${factura.idFactura}"></td>
            <td th:text="${factura.empresa.nombre}"></td>
            <td th:text="${factura.cliente.nombre}"></td>
            <td th:text="${factura.fecha}"></td>
            <td th:text="${factura.estado}"></td>
            <td th:text="${totalesFacturas[factura.idFactura]}"></td>
            <td th:text="${factura.hashVerifactu}"></td>
            <td>
                <a th:href="@{/factura/rectificar/{id}(id=${factura.idFactura})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/factura/historico/{id}(id=${factura.idFactura})}" class="btn btn-info btn-sm">Historico</a>
                <a th:href="@{/factura/pdf/{id}(id=${factura.idFactura})}" class="btn btn-secondary btn-sm">PDF</a>
                <form th:action="@{/factura/email/{id}(id=${factura.idFactura})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-primary btn-sm">Email</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver</a>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center text-bg-success border-0" role="alert" th:if="${success}" id="successToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

    <div class="toast align-items-center text-bg-danger border-0" role="alert" th:if="${error}" id="errorToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const successToast = document.getElementById("successToast");
        const errorToast = document.getElementById("errorToast");

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }
    });
</script>

<div th:replace="~{fragments :: main-footer}"></div>

</body>
</html>
