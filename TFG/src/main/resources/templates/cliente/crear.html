<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${cliente.idCliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'"></h2>

    <form th:action="@{/cliente}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{idCliente}" />

        <div class="mb-3">
            <label class="form-label">Empresa</label>
            <select class="form-select" name="empresaId" required>
                <option value="">Selecciona una empresa</option>
                <option th:each="empresaItem : ${empresas}"
                        th:value="${empresaItem.id_empresa}"
                        th:text="${empresaItem.nombre}"
                        th:selected="${cliente.empresa != null and cliente.empresa.id_empresa == empresaItem.id_empresa}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">NIF</label>
            <input type="text" class="form-control" th:field="*{nif}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <textarea class="form-control" th:field="*{direccion}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text"
                   class="form-control"
                   th:field="*{telefono}"
                   pattern="[0-9]{9}"
                   maxlength="9"
                   inputmode="numeric"
                   placeholder="Ej: 612345678"
                   title="Introduce un teléfono de 9 dígitos">

        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/cliente}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div class="toast align-items-center text-bg-success border-0"
         role="alert"
         th:if="${success}"
         id="successToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

    <div class="toast align-items-center text-bg-danger border-0"
         role="alert"
         th:if="${error}"
         id="errorToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const successToast = document.getElementById('successToast');
        const errorToast = document.getElementById('errorToast');

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }
    });
</script>

</body>
</html>
