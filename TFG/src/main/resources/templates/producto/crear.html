<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments :: main-navbar}"></div>

<div class="container mt-4 pb-5 flex-grow-1">

    <h2 th:text="${producto.idProducto == null} ? 'Nuevo Producto' : 'Editar Producto'"></h2>

    <form th:action="@{/producto}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{idProducto}" />

        <div class="mb-3" th:if="${esAdmin}">
            <label class="form-label">Empresa</label>
            <select class="form-select" name="empresaId" required>
                <option value="">Selecciona una empresa</option>
                <option th:each="empresaItem : ${empresas}"
                        th:value="${empresaItem.id_empresa}"
                        th:text="${empresaItem.nombre}"
                        th:selected="${producto.empresa != null and producto.empresa.id_empresa == empresaItem.id_empresa}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">IVA</label>
            <input type="number" class="form-control" th:field="*{iva}" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/producto}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center text-bg-success border-0" role="alert" th:if="${success}" id="successToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

    <div class="toast align-items-center text-bg-danger border-0" role="alert" th:if="${error}" id="errorToast">
        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const successToast = document.getElementById("successToast");
        const errorToast = document.getElementById("errorToast");

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }
    });
</script>

<div th:replace="~{fragments :: main-footer}"></div>

</body>
</html>
