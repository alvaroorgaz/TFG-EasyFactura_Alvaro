<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${empresa.id == null} ? 'Nueva Empresa' : 'Editar Empresa'"></h2>

    <form th:action="@{/empresa/guardar}" th:object="${empresa}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">CIF</label>
            <input type="text" class="form-control" th:field="*{cif}" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/empresa}" class="btn btn-secondary">Cancelar</a>

    </form>

</div>

</body>
</html>
