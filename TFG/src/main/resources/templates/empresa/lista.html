<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Listado de Empresas</h2>

    <a th:href="@{/empresa/crear}" class="btn btn-success mb-3">
        Nueva Empresa
    </a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>CIF</th>
            <th>Email</th>
            <th>Direccion</th>
            <th>Telefono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id_empresa}"></td>
            <td th:text="${empresa.nombre}"></td>
            <td th:text="${empresa.cif}"></td>
            <td th:text="${empresa.email}"></td>
            <td th:text="${empresa.direccion}"></td>
            <td th:text="${empresa.telefono}"></td>

            <td>
                <a th:href="@{/empresa/editar/{id}(id=${empresa.id_empresa})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/empresa/eliminar/{id}(id=${empresa.id_empresa})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver</a>




</div>


<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <!-- SUCCESS -->
    <div class="toast align-items-center text-bg-success border-0"
         role="alert"
         th:if="${success}"
         id="successToast">

        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

    <!-- ERROR -->
    <div class="toast align-items-center text-bg-danger border-0"
         role="alert"
         th:if="${error}"
         id="errorToast">

        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        const successToast = document.getElementById('successToast');
        const errorToast = document.getElementById('errorToast');

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }

    });
</script>

</body>
</html>
