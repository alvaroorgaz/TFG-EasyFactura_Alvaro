<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Listado de Empresas</h2>

    <a th:href="@{/empresa/crear}" class="btn btn-success mb-3">
        Nueva Empresa
    </a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>CIF</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id}"></td>
            <td th:text="${empresa.nombre}"></td>
            <td th:text="${empresa.cif}"></td>
            <td>
                <a th:href="@{/empresa/editar/{id}(id=${empresa.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/empresa/eliminar/{id}(id=${empresa.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver</a>

</div>

</body>
</html>
