<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${empresa.id_empresa == null} ? 'Nueva Empresa' : 'Editar Empresa'"></h2>
    <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <form th:action="@{/empresa}" th:object="${empresa}" method="post">
        <input type="hidden" th:field="*{id_empresa}" />


        <!-- NOMBRE -->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <!-- CIF -->
        <div class="mb-3">
            <label class="form-label">CIF</label>
            <input type="text" class="form-control" th:field="*{cif}" required>
        </div>

        <!-- EMAIL -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" th:field="*{password}" required>
        </div>

        <!-- DIRECCIÓN -->
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}">
        </div>

        <!-- TELÉFONO -->
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="number" class="form-control" th:field="*{telefono}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/empresa}" class="btn btn-secondary">Cancelar</a>

    </form>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
