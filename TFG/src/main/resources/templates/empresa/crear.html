<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments :: main-navbar}"></div>

<div class="container mt-4 pb-5 flex-grow-1">

    <h2 th:text="${empresa.id_empresa == null} ? 'Nueva Empresa' : 'Editar Empresa'"></h2>

    <form th:action="@{/empresa}" th:object="${empresa}" method="post">
        <input type="hidden" th:field="*{id_empresa}" />


        <!-- NOMBRE -->
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <!-- CIF -->
        <div class="mb-3">
            <label class="form-label">CIF</label>
            <input type="text" class="form-control" th:field="*{cif}" required>
        </div>

        <!-- EMAIL -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>

        <!-- PASSWORD -->
        <div class ="mb-3" th:if="${empresa.id_empresa == null}">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" th:field="*{password}" required>
        </div>

        <!-- DIRECCIÓN -->
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}">
        </div>

        <!-- TELÉFONO -->
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text"
                   class="form-control"
                   th:field="*{telefono}"
                   pattern="[0-9]{9}"
                   maxlength="9"
                   inputmode="numeric"
                   placeholder="Ej: 612345678"
                   title="Introduce un teléfono de 9 dígitos">


        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/empresa}" class="btn btn-secondary">Cancelar</a>

    </form>


</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <!-- SUCCESS -->
    <div class="toast align-items-center text-bg-success border-0"
         role="alert"
         th:if="${success}"
         id="successToast">

        <div class="d-flex">
            <div class="toast-body" th:text="${success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

    <!-- ERROR -->
    <div class="toast align-items-center text-bg-danger border-0"
         role="alert"
         th:if="${error}"
         id="errorToast">

        <div class="d-flex">
            <div class="toast-body" th:text="${error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        const successToast = document.getElementById('successToast');
        const errorToast = document.getElementById('errorToast');

        if (successToast) {
            new bootstrap.Toast(successToast).show();
        }

        if (errorToast) {
            new bootstrap.Toast(errorToast).show();
        }

    });
</script>

<div th:replace="~{fragments :: main-footer}"></div>

</body>
</html>
