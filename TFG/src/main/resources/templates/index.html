<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EasyFactura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments :: main-navbar}"></div>

<div class="container mt-5 pb-5 text-center flex-grow-1">
    <h1>Bienvenido a EasyFactura</h1>
    <p class="lead">Sistema de gestion de facturacion sencillo</p>

    <div class="row g-4 mt-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="mb-3 text-primary" viewBox="0 0 16 16">
                        <path d="M4 8a3 3 0 1 1 6 0A3 3 0 0 1 4 8"/>
                        <path d="M14 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0M6 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/>
                        <path d="M6.5 13a5.5 5.5 0 0 1 11 0v1H6.5zM0 14v-1a4 4 0 0 1 7.5-2H8a4.5 4.5 0 0 0-8 2v1z"/>
                    </svg>
                    <h5 class="card-title">Clientes gestionados</h5>
                    <p class="display-6 fw-bold mb-0" th:text="${totalClientes}"></p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="mb-3 text-success" viewBox="0 0 16 16">
                        <path d="M8.186 1.113a1 1 0 0 0-.372 0L1.846 2.5 8 3.881 14.154 2.5zM15 3.239l-6.5 1.458v10.09l6.354-1.414A1 1 0 0 0 15 12.4zM7.5 14.787V4.697L1 3.239V12.4a1 1 0 0 0 .846.986z"/>
                    </svg>
                    <h5 class="card-title">Productos gestionados</h5>
                    <p class="display-6 fw-bold mb-0" th:text="${totalProductos}"></p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="mb-3 text-warning" viewBox="0 0 16 16">
                        <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
                        <path d="M4.5 7.5A.5.5 0 0 1 5 7h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5m0 2A.5.5 0 0 1 5 9h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5m0 2A.5.5 0 0 1 5 11h4a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5"/>
                    </svg>
                    <h5 class="card-title">Facturas generadas</h5>
                    <p class="display-6 fw-bold mb-0" th:text="${totalFacturas}"></p>
                </div>
            </div>
        </div>
    </div>

    <a th:if="${esAdmin}" th:href="@{/empresa}" class="btn btn-primary btn-lg mt-3 me-2">
        Gestionar Empresas
    </a>

    <a th:href="@{/cliente}" class="btn btn-success btn-lg mt-3">
        Gestionar Clientes
    </a>
</div>

<div th:replace="~{fragments :: main-footer}"></div>

</body>
</html>
